name: Build Cara DJ (Android)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CaraDJ-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A plain download link that never changes: Releases > "Cara DJ for Android" > CaraDJ.apk
      - name: Publish it under Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CaraDJ.apk
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          sleep 3
          gh release create android-latest CaraDJ.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cara DJ for Android" \
            --notes "The newest build. Download CaraDJ.apk on your phone and open it to install. It installs right over the old one and keeps your settings."
